# Our approach (docs/ia.md §2.2). English draft copy (natural, not literal), needs-review: native review in L9.
key: approach
status: needs-review
reviewNote: "English draft copy of the L4 Slovak text (owner request 2026-10-24); native-speaker review needed. No group sizes, schedules, staff, accreditation or legal status are stated; nothing implies instruction in English."
seo:
  title: Our approach
  description: How children learn with us. Small groups, their own pace, a prepared environment, a guide rather than lectures from the front, time outdoors and parents as partners.
sections:
  intro:
    status: needs-review
    eyebrow: Our approach
    title: How children learn with us
    lead: We want children to really understand what they learn in the first four grades, to enjoy learning and to feel safe while they do it. This page describes how we go about it, what we draw on and what you can expect as parents.
  howWeWork:
    status: needs-review
    reviewNote: "Intended way of working (owner to confirm). 'Small groups' stays without a number until a group size is decided; outdoor time is not quantified."
    id: how-we-work
    eyebrow: How we work
    title: Six things that matter to us
    intro:
      - We are not a classroom with rows of desks and a blackboard. We are a community of families and adults who want to give children in grades 1 to 4 a calm, stimulating place to learn.
      - These are the principles we want to work by every day. We shape them in practice together with the children and their parents.
    items:
      - id: small-groups
        title: Small groups
        body:
          - We want to work in small groups in which the adult knows every child and has time for them. In a small group it is easier to ask, easier to admit you do not understand something, and easier to work together.
          - Children of different ages can come together over the same piece of work. Older children consolidate what they know by explaining it, and younger ones see what they can grow into.
      - id: own-pace-in-practice
        title: Their own pace, clear goals
        body:
          - Every child learns to read, write and count at a different speed. One needs more time with times tables, another is already reading books for older children. We fit the pace to the child, not the child to the pace of a class.
          - The goals of the first four grades still apply to everyone. The guide follows where each child is and helps them take the next step.
      - id: prepared-environment
        title: A prepared environment
        body:
          - We arrange the space, materials and equipment so that a child can choose a task on their own, get started and finish it. Everything has its place, is within reach and can be picked up and handled.
          - The environment changes with what the children are exploring. It looks different when they are learning about water than when they are building a model of their village.
      - id: guide
        title: A guide, not a lecture from the front
        body:
          - We call the adult who is with the children a guide. Most of the time they do not stand in front of the group and lecture. They observe, offer new work, ask questions and help when a child gets stuck.
          - A new topic is often introduced briefly, to one child or a small group. Then the guide lets the children try things and discover for themselves, while staying close by.
      - id: time-outdoors
        title: Time outdoors
        body:
          - We want to be outside every day, even when the sun is not shining, as long as it is safe. Nature is not just a place for breaks. You can measure, count, observe, draw and tell stories there.
          - Movement helps many children concentrate. After time outdoors, work at the table often goes better too.
      - id: parents-as-partners
        title: Parents as partners
        body:
          - Parents know their child best. We want to talk with you regularly about what is going well for your child and what they are struggling with, and work out together what helps.
          - If you would like to, you can enrich the community too, for example with your profession, a craft or help with a project. It is not a requirement.
        link:
          to: parents
          hash: working-together
          label: How we work with parents
