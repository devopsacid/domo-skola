  topics:
    status: needs-review
    reviewNote: "Intended practice (owner to confirm). Formal assessment stays in pendingNote until settings.legalModel is verified."
    id: how-we-learn
    eyebrow: Learning in context
    title: Projects, emotions, pace and progress
    intro:
      - On an ordinary day the four pillars overlap. These topics show where they meet.
    items:
      - id: project-learning
        title: Learning through projects
        body:
          - A project starts with a question the children care about, such as where the water in a stream comes from or how to build a bird box. Reading, maths, science and art can all come together around it.
          - Children plan, try things out, keep records and finally show what they found out, for example to the other children or to their parents. Topics and the length of projects may vary with the age and interests of the group.
      - id: emotional-development
        title: Emotional development
        body:
          - Children learn better when they feel safe. So we also pay attention to how children name their feelings, cope with disappointment and reach agreement when they disagree.
          - This might be a morning circle where everyone says how they are, or looking for a solution together when something goes wrong. We do not want to shout, shame or set children against each other.
      - id: individual-pace
        title: Individual pace
        body:
          - Children of the same age are not equally far along in everything. A child may stay longer with one thing and move faster with another.
          - Working at their own pace does not mean goals don't matter. The guide follows where each child is heading and offers the next step when they are ready. If something does not move for a while, we will tell you and look for the reason together.
      - id: progress
        title: How progress is observed and assessed
        body:
          - We want to follow progress continuously. We watch children at work, keep their work and talk with them about what is going well and what they want to work on. During the day we want to give spoken feedback rather than grades.
          - We want to talk with parents about progress regularly and concretely, looking at the child's work together. The form and frequency of these conversations are still being worked out.
        pendingNote: How formal assessment will work, such as a school report or an examination, depends on the legal model and on the school where your child is enrolled. We are still confirming this part.
        dependsOnFacts: [settings.legalModel]
        link:
          to: parents
          hash: legal-status
          label: Legal and organisational status
  complement:
    status: needs-review
    id: how-they-fit
    eyebrow: How it fits together
    title: How the four approaches complement each other
    body:
      - Each approach answers a different question. Together they form one whole, not four separate programmes.
    items:
      - key: montessori
        role: Environment
        text: How to prepare the space and materials so that a child can choose meaningful work on their own.
      - key: respectful
        role: Relationships
        text: How we talk to each other, resolve disagreements and build trust between children, guides and parents.
      - key: constructivist
        role: Understanding
        text: How a child builds understanding through their own experience, questions and exploration.
      - key: hejny
        role: Mathematics
        text: How understanding grows in maths, step by step, in settings the children already know.
    caveat: Not every principle applies in the same way in every situation or to every child. We treat these approaches as inspiration rather than fixed rules, and adapt them to the children's age and needs.
  notClaimed:
    status: needs-review
    reviewNote: "Honesty block (brief §2, §3, §5.4). OWNER MUST CONFIRM there is no Montessori accreditation and no Hejný certification. Keep it until the facts it mentions are verified; then reword, never drop silently."
    id: what-we-do-not-claim
    eyebrow: Plainly
    title: What we do not claim
    intro:
      - We want you to decide based on accurate information. That is why we are also open about what we are not and what we do not promise.
    items:
      - id: not-a-school
        title: We do not claim to be a school
        body:
          - Until our legal model is confirmed, we do not claim to be a school, nor that taking part in the community by itself fulfils compulsory school attendance. The For parents page explains how the formal side works.
        link:
          to: parents
          hash: how-it-works-formally
          label: How it works formally
      - id: no-accreditation
        title: No Montessori accreditation, no Hejný certification
        body:
          - We are inspired by Montessori principles and Hejný mathematics. That does not make us an accredited Montessori institution, and we hold no certification for the Hejný method.
      - id: no-promises
        title: We do not promise results
        body:
          - We do not promise exceptional results, above-average grades, or that our way suits every child. We do promise to follow your child closely and to talk openly with you about how they are doing.
      - id: not-against-schools
        title: We are not against ordinary schools
        body:
          - Many children are happy in an ordinary school and learn well there. We offer a different path for families who prefer a smaller group and learning through discovery.
