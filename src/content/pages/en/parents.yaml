seo:
  title: For parents
  description: Practical information for parents of children in grades 1 to 4. Grades, travel, working with families, how applying works, and how school enrolment and individual education work in Slovakia in general terms.
sections:
  intro:
    status: needs-review
    eyebrow: For parents
    title: Practical information for parents
    lead: Everything you need to know before we first meet. Anything we are still confirming is clearly marked and will be filled in as soon as it is certain.
  basics:
    status: needs-review
    id: basics
    eyebrow: The basics
    title: Who it is for and where from
    items:
      - id: grades-and-ages
        title: Grades and ages
        body:
          - The community is for children in grades 1 to 4 of primary school, roughly 6 to 10 years old. Children of different ages can learn together, but each works towards their own goals.
      - id: getting-here
        title: Where children come from
        body:
          - We welcome families from the areas around Banská Bystrica, Ružomberok and Liptovský Mikuláš. We are one community, not a network of branches in each town. We will publish where we meet once it is confirmed.
          - If you live further away, it is worth thinking about the journey in advance. If you would like to share driving with another family from your area, let us know when we first meet.
        facts:
          - label: Venue
            path: settings.venue.name
          - label: Town
            path: settings.venue.municipality
          - label: Getting here
            path: settings.venue.commuteNotes
  learning:
    status: needs-review
    reviewNote: "Intended practice; formal assessment depends on the legal model (pendingNote)."
    id: learning
    eyebrow: Learning
    title: How learning is organised
    items:
      - id: learning-structure
        title: How learning is structured
        body:
          - The day moves between independent work with materials, small-group work with the guide, projects and time outdoors. Clear goals, a regular rhythm and agreed rules give freedom a firm frame.
          - Freedom here does not mean a child does whatever they like. It means that, in a prepared environment, they choose how and in what order they reach a goal.
        link:
          to: day
          label: What a day might look like
      - id: educational-goals
        title: Educational goals
        body:
          - We want children to understand the primary curriculum, not just memorise it. Reading with understanding, writing, arithmetic and getting to know the world around them matter to us as much as independence, a love of learning and the ability to work with others.
        pendingNote: We are still confirming how our goals relate to the Slovak national curriculum and to the requirements of the school where your child is enrolled.
        dependsOnFacts: [settings.legalModel]
      - id: following-progress
        title: How we follow progress
        body:
          - We want to follow progress continuously, by observing, collecting your child's work and talking with them. We want to talk with you about it regularly and concretely, looking at what your child has actually done.
        pendingNote: How formal assessment and examinations will work depends on the school where your child is enrolled. We are still confirming this part.
        dependsOnFacts: [settings.legalModel]
        link:
          to: approach
          hash: progress
          label: More about following progress
  family:
    status: needs-review
    reviewNote: "Communication form and frequency not decided (owner). Cooperation with a school depends on settings.legalModel."
    id: working-together
    eyebrow: Working with families
    title: Parents as partners
    intro:
      - A child's education is shared work between the family and the community. We want you to know what is going on, and to feel free to speak up when something worries you.
    items:
      - id: communication
        title: Communication with parents
        body:
          - We want to stay in regular touch, for example with short updates on what your child is working on and with personal conversations over their work. The exact form and frequency are still being worked out.
          - If something is happening at home or in the group, it is better to talk about it early. There is also room for a quick word at drop-off and pick-up.
      - id: getting-involved
        title: How you can get involved
        body:
          - Some parents like to come and show their work, craft or hobby; others help with a trip or a project. This is an offer, not an obligation.
          - We also want to meet as parents, for example at shared meetings where we talk about how the community is doing and what we would like to change.
      - id: school-cooperation
        title: Working with the school where your child is enrolled
        body:
          - If your child is enrolled at another school, we want to work with that school so that you know clearly what it expects and your child is well prepared.
        pendingNote: We are still confirming which school we will work with and in what form.
        dependsOnFacts: [settings.legalModel]
        link:
          to: parents
          hash: legal-status
          label: Legal and organisational status
      - id: attendance
        title: Expected attendance
        body:
          - Regular attendance helps a child become part of the group and of shared projects. We will publish how often and on which days we meet once it is confirmed.
        facts:
          - label: Attendance
            path: settings.operations.attendance
  practical:
    status: needs-review
    reviewNote: "Meals, outdoor time and fees stay pending until verified; fees render only when settings.fees is verified and visible."
    id: practical
    eyebrow: Practical details
    title: Meals, time outdoors, fees and visiting
    items:
      - id: meals-and-outdoors
        title: Meals and time outdoors
        body:
          - Time outdoors is an important part of learning for us, not just a break. We want to go out every day as long as it is safe, so clothes that can get dirty are a good idea.
        facts:
          - label: Meals
            path: settings.operations.meals
          - label: Time outdoors
            path: settings.operations.outdoorTime
      - id: fees
        title: Tuition and fees
        facts:
          - label: Fees
            path: settings.fees
            pending: Fee information will follow
        link:
          to: contact
          label: Ask about costs
      - id: visiting
        title: Visiting the community
        body:
          - The best way to find out whether this is the right place for your child is to come and see. We will arrange a visit or an introductory meeting individually. Bring your questions; we are glad to answer them.
        link:
          to: contact
          query: subject=visit
          label: Arrange a visit
  admission:
    status: needs-review
    id: admission
    eyebrow: Applying
    title: Indicative admission process
    intro: This is how we picture the path from first contact to agreeing on next steps. We want you to decide without pressure and with enough information.
    note: The process is still being finalised. An application is an expression of interest, not a confirmation of a place.
    ctaPrimary: Apply for your child
    ctaSecondary: Arrange a meeting
  formal:
    status: needs-review
    reviewNote: "LEGAL REVIEW REQUIRED: general description of Slovak rules (enrolment in a school in the network, individual education approved by the head of that school, periodic examination). Check against the current Slovak school act before verified. Never states which route the community uses."
    id: how-it-works-formally
    eyebrow: The formal side
    title: How it works formally
    intro:
      - Applying to the community and enrolling at a school are two different things. The community is in Slovakia, so here we describe briefly and in general terms how this usually works under Slovak rules. This is not legal advice; always check the details with the school.
    items:
      - id: enrolled-at-a-school
        title: A child is always enrolled at a school
        body:
          - In Slovakia, compulsory school attendance is fulfilled at a school that is part of the official school network. Even when a child learns elsewhere, they have a school where they are enrolled and which is responsible for assessing them.
          - Parents enrol their child at a school, following the rules and dates set by the school and the municipality.
      - id: individual-education
        title: Individual education
        body:
          - In individual education (the Slovak term for a form of home education), the child does not learn in a classroom at their school but elsewhere. The parent asks the head of the school where the child is enrolled for permission. The law sets conditions, for example on who provides the education.
          - The school then regularly checks what the child has learned, usually through an examination, and the child receives a school report on that basis.
      - id: what-it-means-here
        title: What this means for us
        body:
          - Applying on this website is an expression of interest in the community. Formal steps towards a school, such as enrolment or an application, are taken by the parent. We want to help you find your way through what needs doing and when.
        pendingNote: We are still confirming which of these routes our community will use and which school it will work with. Until that is certain, we promise none of it.
        dependsOnFacts: [settings.legalModel]
  legal:
    status: needs-review
    reviewNote: "LEGAL REVIEW REQUIRED: the three general descriptions must be checked against current Slovak school law before verified. Never state which form applies."
    id: legal-status
    eyebrow: Legal and organisational status
    title: A home-education community, a school and individual education
    intro:
      - A domoškola (home-education community) is not automatically the same as a registered primary school. So that you can decide with confidence, we explain the difference between three arrangements you may come across.
      - Which of them applies to our community will be published only after it has been confirmed and legally reviewed.
    formsTitle: Three different arrangements
    forms:
      - key: registered_school
        title: Registered primary school
        text: A school listed in the official network of schools. The child is enrolled there, fulfils compulsory school attendance there and receives school reports from it.
      - key: community_group
        title: Community learning group
        text: A group of children and adults who learn together regularly. On its own it is not a school and does not issue school reports. Alongside it, the child must be enrolled at a school.
      - key: individual_education
        title: Individual (home) education
        text: The child is educated outside classroom teaching, with the consent of the school where they are enrolled. The school checks what the child has learned, usually through an examination.
    formsNote: This is a general description to help you find your way, not legal advice. The conditions are set by the regulations in force in Slovakia and by the school where the child is enrolled.
    ourModelTitle: How our community is organised
    ourModelPending: We will set out our legal model once it is confirmed. Until then we do not claim to be a school, to hold any accreditation, or that taking part in the community fulfils compulsory school attendance on its own.
    partnersTitle: Partner schools
    responsibilitiesTitle: What parents are responsible for
    responsibilitiesPending: We will publish parents' responsibilities, for example towards the school where the child is enrolled, together with the legal model.
    contactLink: Ask us for details
  cta:
    status: needs-review
    title: Do you have more questions?
    text: We would be glad to talk with you in person. A meeting tells you more than a website can.
    ctaPrimary: Apply for your child
    ctaSecondary: Arrange a meeting
