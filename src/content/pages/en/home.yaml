seo:
  title: Community learning for grades 1–4
  description: A small learning community for children in grades 1–4. Learning by discovery, inspired by Montessori principles, respectful education and the Hejný mathematics method. For families around Banská Bystrica, Ružomberok and Liptovský Mikuláš.
sections:
  hero:
    status: needs-review
    eyebrow: Community learning for grades 1–4
    headline: A place where children discover the world at their own pace.
    lead: We create a respectful environment for children in grades 1 to 4, where learning grows from discovery, experience, independence and working together. We draw on Montessori principles, build on constructivist learning and teach maths with the Hejný method.
    ctaPrimary: Apply for your child
    ctaSecondary: Discover our approach
    facts:
      - Grades 1–4, roughly ages 6 to 10
      - For families around Banská Bystrica, Ružomberok and Liptovský Mikuláš
  philosophy:
    status: needs-review
    eyebrow: Our philosophy
    title: Children learn best when they can explore, ask questions and feel safe doing it.
    body:
      - We believe learning starts with relationships. A child who feels accepted dares to try, to get things wrong and to try again.
      - So we give children time, real tasks and adults who listen. Clear goals and boundaries matter here just as much as the freedom to choose where to begin.
    points:
      - title: Relationships
        text: Calm communication between children, guides and parents.
      - title: Discovery
        text: Children work things out for themselves, with materials and questions.
      - title: Taking part
        text: Children help shape the rules, the projects and the day.
    link: How we learn
  pillars:
    status: needs-review
    eyebrow: Four pillars
    title: Four approaches that work together
    intro: We don't treat any of them as dogma. We take what helps children understand, cooperate and become independent.
    benefitsLabel: What it means for your child
    links:
      montessori: More about Montessori principles
      respectful: More about respectful education
      constructivist: More about constructivist learning
      hejny: More about Hejný mathematics
  day:
    status: needs-review
    eyebrow: A day with us
    title: What a day can look like
    intro: The day has a calm rhythm, moving between independent work, shared projects and time outdoors.
    link: More about a day with us
  outcomes:
    status: needs-review
    eyebrow: What children develop
    title: Skills children need beyond the classroom
    intro: We don't promise the same results for every child. But we deliberately support these skills every day, in small, concrete moments.
    items:
      - title: Independence
        text: Choosing a task, getting the materials ready and finishing what they started.
      - title: Critical thinking
        text: Asking “why?” and checking whether an answer really holds.
      - title: Cooperation
        text: Agreeing, sharing out tasks and helping a classmate.
      - title: Mathematical reasoning
        text: Looking for patterns, estimating and explaining the steps.
      - title: Communication
        text: Saying what they think and listening to a different view.
      - title: Creativity
        text: Trying more than one solution and welcoming new ideas.
      - title: Responsibility
        text: Caring for materials, the space and the group's agreements.
      - title: Curiosity
        text: Wanting to ask more and take an idea one step further.
  examples:
    status: needs-review
    eyebrow: How learning works
    title: Learning you can hold in your hands
    intro: Two examples from the first years of primary school, showing how a question turns into understanding.
    items:
      - key: measurement
        title: Measuring with footsteps first, then a tape measure
        text: The children want to build a small house for an animal out of cardboard and wood. First they measure the room and the parts with their own steps and hands, and compare results. Everyone gets a different number, and they work out for themselves why people need a shared unit. Only then do they pick up the tape measure and ruler.
        takeaway: They understand measuring before they learn to write it down.
      - key: hejny
        title: Maths in Hejný environments
        text: In the Stepping environment, children walk forwards and backwards along a line and discover addition and subtraction through their steps. In Stairs and Bus they look for rules and test them. Each child can reach the answer a different way, then explain to the group why their solution works.
        takeaway: Children don't just calculate. They can say why the answer is right.
