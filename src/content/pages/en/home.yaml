    eyebrow: Environment
    title: Space, materials and nature around us
    intro: A prepared environment matters to us as much as the programme. We'll add photos of the space, the materials and time outdoors once we have them.
    tiles:
      - kind: venue
        label: Our learning space
      - kind: materials
        label: Learning materials
