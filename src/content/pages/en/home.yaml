        label: Learning outdoors
  fit:
    status: needs-review
    eyebrow: Who it suits
    title: Who our community may suit
    intro: Every child is different. The community may be a good choice for families who…
    items:
      - want their child to understand, not just memorise,
      - value their child's own pace alongside clear goals and structure,
      - are looking for a calm, respectful setting with a smaller group of children,
      - want to work with the community and talk regularly about their child's progress,
      - like learning to happen outdoors and through real tasks, too.
    closing: Not sure whether it's right for your child? Let's talk. Together we'll think about what your child needs.
    cta: Arrange a meeting
  regions:
    status: needs-review
    eyebrow: Regions
    title: For families from three regions
    intro: We are one community, not a network of branches. Families from Banská Bystrica, Ružomberok, Liptovský Mikuláš and the surrounding areas are all welcome.
    pending: We will publish the exact meeting place and travel information once confirmed. If you have a question about getting here, write to us.
  process:
    status: needs-review
    eyebrow: Applying
    title: How applying works
    note: We are still finalising the process. An application is an expression of interest, not a confirmation of a place.
    steps:
      - title: You get in touch
        text: Fill in a short application or write to us. We'll reply and suggest a time to talk.
