        text: We talk about your child and what you are looking for, and answer your questions.
      - title: Getting to know each other
        text: You and your child see the space and meet the people. Together we consider whether it's a good fit.
      - title: Agreeing next steps
        text: We agree on what happens next and explain which conditions and documents are needed.
