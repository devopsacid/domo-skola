  topics:
    status: needs-review
    reviewNote: "Intended practice (owner to confirm). Formal assessment stays in pendingNote until settings.legalModel is verified."
    id: jak-se-ucime
    eyebrow: Učení v souvislostech
    title: Projekty, emoce, tempo a pokrok
    intro:
      - Čtyři pilíře se v běžném dni prolínají. Tato témata ukazují, kde se potkávají.
    items:
      - id: uceni-v-projektech
        title: Učení skrze projekty
        body:
          - Projekt začíná otázkou, která děti zajímá, například odkud se bere voda v potoce nebo jak postavit budku pro ptáky. Kolem ní se může propojit čtení, matematika, přírodověda i výtvarná práce.
          - Děti plánují, zkoušejí, zaznamenávají a na konci ukážou, na co přišly, třeba ostatním dětem nebo rodičům. Témata a délka projektů se mohou lišit podle věku a zájmu skupiny.
      - id: emocni-vyvoj
        title: Emoční vývoj
        body:
          - Dítě se učí lépe, když se cítí v bezpečí. Proto se věnujeme i tomu, jak děti pojmenovávají své pocity, jak zvládají zklamání a jak se domluví, když se neshodnou.
          - Může to být například ranní kruh, ve kterém každý řekne, jak se má, nebo společné hledání řešení, když se něco nepovede. Nekřičíme, neztrapňujeme a nestavíme děti proti sobě.
      - id: vlastni-tempo
        title: Individuální tempo
        body:
          - Děti ve stejném věku nejsou ve všem stejně daleko. Dítě může u něčeho zůstat déle a jinde postupovat rychleji.
          - Vlastní tempo neznamená, že na cílech nezáleží. Průvodce sleduje, kam dítě směřuje, a nabídne mu další krok, když je na něj připravené. Když něco delší dobu nejde, řekneme vám to a budeme spolu hledat příčinu.
      - id: pokrok
        title: Jak sledujeme a hodnotíme pokrok
        body:
          - Pokrok chceme sledovat průběžně. Pozorujeme dítě při práci, schováváme jeho práce a mluvíme s ním o tom, co se mu daří a na čem chce pracovat. Během dne dostává dítě místo známek slovní zpětnou vazbu.
          - S rodiči chceme o pokroku mluvit pravidelně a konkrétně, nad pracemi dítěte. Formu a četnost těchto rozhovorů ještě upřesňujeme.
        pendingNote: Jak bude probíhat formální hodnocení, například vysvědčení nebo přezkoušení, záleží na právním modelu a na škole, ve které bude dítě zapsané. Tuto část zatím ověřujeme.
