  complement:
    status: needs-review
    id: jak-se-doplnuji
    eyebrow: Jak to spolu souvisí
    title: Jak se čtyři přístupy doplňují
    body:
      - Každý z přístupů odpovídá na jinou otázku. Dohromady tvoří jeden celek, ne čtyři samostatné programy.
    items:
      - key: montessori
        role: Prostředí
        text: Jak připravit prostor a pomůcky, aby si dítě umělo samo vybrat smysluplnou práci.
      - key: respectful
        role: Vztahy
        text: Jak spolu mluvíme, řešíme spory a budujeme důvěru mezi dětmi, průvodci a rodiči.
      - key: constructivist
        role: Porozumění
        text: Jak si dítě buduje porozumění vlastní zkušeností, otázkami a zkoumáním.
      - key: hejny
        role: Matematika
        text: Jak vzniká porozumění v matematice, krok za krokem v prostředích, která děti znají.
    caveat: Ne každý princip se uplatňuje stejně v každé situaci a u každého dítěte. Přístupy bereme jako inspiraci, ne jako pevná pravidla, a přizpůsobujeme je věku a potřebám dětí.
  notClaimed:
    status: needs-review
    reviewNote: "Honesty block (brief §2, §3, §5.4). Keep it until the facts it mentions are verified; then reword, never drop silently."
    id: co-netvrdime
    eyebrow: Otevřeně
    title: Co netvrdíme
    intro:
      - Chceme, abyste se rozhodovali podle pravdivých informací. Proto otevřeně píšeme i o tom, čím nejsme a co neslibujeme.
    items:
      - id: nejsme-skola
        title: Netvrdíme, že jsme škola
        body:
          - Dokud nebude potvrzen náš právní model, netvrdíme, že jsme škola, ani že účast v komunitě sama o sobě plní povinnou školní docházku. Jak to funguje formálně, vysvětlujeme na stránce Pro rodiče.
        link:
          to: parents
          hash: jak-to-funguje-formalne
          label: Jak to funguje formálně
      - id: bez-akreditace
        title: Nemáme akreditaci Montessori ani certifikát Hejného metody
        body:
          - Inspirujeme se principy Montessori a Hejného metodou. Neznamená to, že jsme akreditované Montessori zařízení, ani že máme certifikát na Hejného metodu.
      - id: bez-slibu
        title: Neslibujeme výsledky
        body:
          - Neslibujeme výjimečné výsledky, nadprůměrné známky ani to, že náš způsob vyhovuje každému dítěti. Slibujeme, že budeme dítě pozorně sledovat a otevřeně s vámi mluvit o tom, jak se mu daří.
      - id: ne-proti-skolam
        title: Nejsme proti běžným školám
        body:
          - Mnoho dětí je v běžné škole spokojených a učí se v ní dobře. Nabízíme jinou cestu rodinám, kterým víc vyhovuje menší skupina a učení objevováním.
  cta:
    status: needs-review
    title: Chcete vidět, jak to vypadá naživo?
    text: Nejvíc se dozvíte při osobním setkání. Napište nám, nebo rovnou vyplňte krátkou přihlášku. Přihláška je projevem zájmu, ne potvrzením přijetí.
    ctaPrimary: Přihlásit dítě
    ctaSecondary: Domluvit si schůzku
