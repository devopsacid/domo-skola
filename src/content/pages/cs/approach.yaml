seo:
  title: Náš přístup
  description: Jak se u nás děti učí. Malé skupiny, vlastní tempo, připravené prostředí, průvodce místo výkladu před tabulí, čas venku a rodiče jako partneři.
sections:
  intro:
    status: needs-review
    eyebrow: Náš přístup
    title: Jak se u nás děti učí
    lead: Chceme, aby děti učivu prvního stupně opravdu rozuměly, aby se učily rády a aby se přitom cítily v bezpečí. Na této stránce popisujeme, jak se o to snažíme, z čeho vycházíme a co můžete čekat jako rodiče.
  howWeWork:
    status: needs-review
    reviewNote: "Intended way of working (owner to confirm). 'Malé skupiny' stays without a number until a group size is decided; outdoor time is not quantified."
    id: jak-pracujeme
    eyebrow: Jak pracujeme
    title: Šest věcí, na kterých nám záleží
    intro:
      - Nejsme třída s lavicemi a tabulí. Jsme komunita rodin a dospělých, kteří chtějí dětem 1. až 4. ročníku nabídnout klidné a podnětné místo pro učení.
      - Toto jsou zásady, podle kterých chceme pracovat každý den. Konkrétní podobu jim dáváme společně s dětmi a rodiči.
    items:
      - id: male-skupiny
        title: Malé skupiny
        body:
          - Chceme pracovat v malých skupinách, ve kterých dospělý zná každé dítě a má na něj čas. V malé skupině se snáz ptá, snáz se přiznává, že něčemu nerozumím, a snáz se spolupracuje.
          - Děti různého věku se mohou potkávat u jedné práce. Starší si upevní, co umí, když to vysvětlují, a mladší vidí, kam mohou dorůst.
      - id: vlastni-tempo-v-praxi
        title: Vlastní tempo, jasné cíle
        body:
          - Každé dítě se učí číst, psát a počítat jinak rychle. Jedno potřebuje u násobilky víc času, jiné už čte knížky pro starší. Tempo přizpůsobujeme dítěti, ne dítě tempu třídy.
          - Cíle prvního stupně ale platí pro všechny. Průvodce sleduje, kde dítě je, a pomáhá mu udělat další krok.
      - id: pripravene-prostredi
        title: Připravené prostředí
        body:
          - Prostor, pomůcky a materiály připravujeme tak, aby si dítě umělo samo vybrat práci, pustit se do ní a dokončit ji. Věci mají své místo, jsou na dosah a dají se vzít do ruky.
          - Prostředí se mění podle toho, co děti právě zkoumají. Jinak vypadá, když se učí o vodě, a jinak, když staví model obce.
      - id: pruvodce
        title: Průvodce, ne výklad před tabulí
        body:
          - Dospělému, který je s dětmi, říkáme průvodce. Většinu času nestojí před skupinou a nevykládá. Pozoruje, nabízí novou práci, klade otázky a pomáhá, když se dítě zasekne.
          - Nové téma často představí krátce, jednomu dítěti nebo malé skupince. Pak nechá děti zkoušet a objevovat samotné a je nablízku.
      - id: cas-venku
        title: Čas venku
        body:
          - Venku chceme být každý den, i když nesvítí slunce, pokud je to bezpečné. Příroda není jen místem na přestávku. Dá se v ní měřit, počítat, pozorovat, kreslit i vyprávět.
          - Pohyb dětem pomáhá soustředit se. Po čase venku se často lépe pracuje i u stolu.
      - id: rodice-jako-partneri
        title: Rodiče jako partneři
        body:
          - Rodiče znají své dítě nejlépe. Chceme s vámi pravidelně mluvit o tom, co se dítěti daří a s čím zápasí, a společně hledat, co mu pomůže.
          - Pokud máte chuť, můžete komunitu obohatit i vy, například svou profesí, řemeslem nebo pomocí s projektem. Není to podmínka.
        link:
          to: parents
          hash: spoluprace
          label: Jak spolupracujeme s rodiči
