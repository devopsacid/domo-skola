seo:
  title: Náš prístup
  description: Ako sa u nás deti učia. Malé skupiny, vlastné tempo, pripravené prostredie, sprievodca namiesto výkladu pred tabuľou, čas vonku a rodičia ako partneri.
sections:
  intro:
    status: needs-review
    eyebrow: Náš prístup
    title: Ako sa u nás deti učia
    lead: Chceme, aby deti učivu prvého stupňa naozaj rozumeli, aby sa učili s chuťou a aby sa pri tom cítili bezpečne. Na tejto stránke opisujeme, ako sa o to snažíme, z čoho vychádzame a čo môžete očakávať ako rodičia.
  howWeWork:
    status: needs-review
    reviewNote: "Intended way of working (owner to confirm). 'Malé skupiny' stays without a number until a group size is decided; outdoor time is not quantified."
    id: ako-pracujeme
    eyebrow: Ako pracujeme
    title: Šesť vecí, na ktorých nám záleží
    intro:
      - Nie sme trieda s lavicami a tabuľou. Sme komunita rodín a dospelých, ktorí chcú deťom 1. až 4. ročníka ponúknuť pokojné a podnetné miesto na učenie.
      - Toto sú zásady, podľa ktorých chceme pracovať každý deň. Konkrétnu podobu im dávame spolu s deťmi a rodičmi.
    items:
      - id: male-skupiny
        title: Malé skupiny
        body:
          - Chceme pracovať v malých skupinách, v ktorých dospelý pozná každé dieťa a má naň čas. V malej skupine sa ľahšie pýta, ľahšie sa priznáva, že niečomu nerozumiem, a ľahšie sa spolupracuje.
          - Deti rôzneho veku sa môžu stretávať pri jednej práci. Starší si upevnia, čo vedia, keď to vysvetľujú, a mladší vidia, kam môžu dorásť.
      - id: vlastne-tempo-v-praxi
        title: Vlastné tempo, jasné ciele
        body:
          - Každé dieťa sa učí čítať, písať a počítať inak rýchlo. Jedno potrebuje pri násobilke viac času, iné už číta knihy pre starších. Tempo prispôsobujeme dieťaťu, nie dieťa tempu triedy.
          - Ciele prvého stupňa však platia pre všetkých. Sprievodca sleduje, kde dieťa je, a pomáha mu urobiť ďalší krok.
      - id: pripravene-prostredie
        title: Pripravené prostredie
        body:
          - Priestor, pomôcky a materiály pripravujeme tak, aby si dieťa vedelo samo vybrať prácu, pustiť sa do nej a dokončiť ju. Veci majú svoje miesto, sú na dosah a dajú sa chytiť do rúk.
          - Prostredie sa mení podľa toho, čo deti práve skúmajú. Inak vyzerá, keď sa učia o vode, a inak, keď stavajú model obce.
      - id: sprievodca
        title: Sprievodca, nie výklad pred tabuľou
        body:
          - Dospelého, ktorý je s deťmi, voláme sprievodca. Väčšinu času nestojí pred skupinou a nevykladá. Pozoruje, ponúka novú prácu, kladie otázky a pomáha, keď dieťa uviazne.
          - Novú tému často predstaví krátko, jednému dieťaťu alebo malej skupinke. Potom nechá deti skúšať a objavovať samé a je nablízku.
      - id: cas-vonku
        title: Čas vonku
        body:
          - Vonku chceme byť každý deň, aj keď nesvieti slnko, pokiaľ je to bezpečné. Príroda nie je len miestom na prestávku. Dá sa v nej merať, počítať, pozorovať, kresliť aj rozprávať.
          - Pohyb pomáha deťom sústrediť sa. Po čase vonku sa často lepšie pracuje aj pri stole.
      - id: rodicia-ako-partneri
        title: Rodičia ako partneri
        body:
          - Rodičia dieťa poznajú najlepšie. Chceme sa s vami pravidelne rozprávať o tom, čo sa dieťaťu darí a s čím zápasí, a spoločne hľadať, čo mu pomôže.
          - Ak máte chuť, môžete komunitu obohatiť aj vy, napríklad svojou profesiou, remeslom alebo pomocou pri projekte. Nie je to podmienka.
        link:
          to: parents
          hash: spolupraca
          label: Ako spolupracujeme s rodičmi
