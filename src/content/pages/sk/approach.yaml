  topics:
    status: needs-review
    reviewNote: "Projects, emotional development and pace describe intended practice (owner to confirm). Formal assessment stays in pendingNote until settings.legalModel is verified."
    id: ako-sa-ucime
    eyebrow: Učenie v súvislostiach
    title: Projekty, emócie, tempo a pokrok
    intro:
      - Štyri piliere sa v bežnom dni prelínajú. Tieto témy ukazujú, kde sa stretávajú.
    items:
      - id: ucenie-v-projektoch
        title: Učenie cez projekty
        body:
          - Projekt sa začína otázkou, ktorá deti zaujíma, napríklad odkiaľ sa berie voda v potoku alebo ako postaviť búdku pre vtáky. Okolo nej sa môžu spojiť čítanie, matematika, prírodoveda aj výtvarná práca.
          - Deti plánujú, skúšajú, zaznamenávajú a na konci ukážu, na čo prišli, napríklad ostatným deťom alebo rodičom. Témy a dĺžka projektov sa môžu líšiť podľa veku a záujmu skupiny.
      - id: emocionalny-vyvin
        title: Emocionálny vývin
        body:
          - Dieťa sa učí lepšie, keď sa cíti bezpečne. Preto sa venujeme aj tomu, ako deti pomenúvajú svoje pocity, ako zvládajú sklamanie a ako sa dohodnú, keď sa nezhodnú.
          - Môže to byť napríklad ranný kruh, v ktorom každý povie, ako sa má, alebo spoločné hľadanie riešenia, keď sa niečo nepodarí. Nekričíme, nezahanbujeme a nestaviame deti proti sebe.
      - id: vlastne-tempo
        title: Individuálne tempo
        body:
          - Deti v rovnakom veku nie sú vo všetkom rovnako ďaleko. Dieťa môže pri niečom zostať dlhšie a inde postupovať rýchlejšie.
          - Vlastné tempo neznamená, že na cieľoch nezáleží. Sprievodca sleduje, kam dieťa smeruje, a ponúkne mu ďalší krok, keď je naň pripravené. Ak niečo dlhšie nejde, povieme vám to a budeme spolu hľadať príčinu.
      - id: pokrok
        title: Ako sledujeme a hodnotíme pokrok
        body:
          - Pokrok chceme sledovať priebežne. Pozorujeme dieťa pri práci, odkladáme jeho práce a rozprávame sa s ním o tom, čo sa mu darí a na čom chce pracovať. Počas dňa dostáva dieťa namiesto známok slovnú spätnú väzbu.
          - S rodičmi sa o pokroku chceme rozprávať pravidelne a konkrétne, nad prácami dieťaťa. Formu a frekvenciu týchto rozhovorov ešte upresňujeme.
        pendingNote: Ako bude prebiehať formálne hodnotenie, napríklad vysvedčenie alebo preskúšanie, závisí od právneho modelu a od školy, v ktorej bude dieťa zapísané. Túto časť zatiaľ potvrdzujeme.
        dependsOnFacts: [settings.legalModel]
        link:
          to: parents
          hash: pravny-status
          label: Právny a organizačný status
  complement:
    status: needs-review
    id: ako-sa-doplnaju
    eyebrow: Ako to spolu súvisí
    title: Ako sa štyri prístupy dopĺňajú
    body:
      - Každý z prístupov odpovedá na inú otázku. Spolu tvoria jeden celok, nie štyri samostatné programy.
    items:
      - key: montessori
        role: Prostredie
        text: Ako pripraviť priestor a pomôcky, aby si dieťa vedelo samo vybrať zmysluplnú prácu.
      - key: respectful
        role: Vzťahy
        text: Ako spolu hovoríme, riešime spory a budujeme dôveru medzi deťmi, sprievodcami a rodičmi.
      - key: constructivist
        role: Porozumenie
        text: Ako si dieťa buduje porozumenie vlastnou skúsenosťou, otázkami a skúmaním.
      - key: hejny
        role: Matematika
        text: Ako vzniká porozumenie v matematike, krok za krokom v prostrediach, ktoré deti poznajú.
    caveat: Nie každý princíp sa uplatňuje rovnako v každej situácii a pri každom dieťati. Prístupy berieme ako inšpiráciu, nie ako pevné pravidlá, a prispôsobujeme ich veku a potrebám detí.
  notClaimed:
    status: needs-review
    reviewNote: "Honesty block (brief §2, §3, §5.4). Keep it until the facts it mentions are verified; then reword, never drop silently."
    id: co-netvrdime
    eyebrow: Otvorene
    title: Čo netvrdíme
    intro:
      - Chceme, aby ste sa rozhodovali podľa pravdivých informácií. Preto otvorene píšeme aj o tom, čo nie sme a čo nesľubujeme.
    items:
      - id: nie-sme-skola
        title: Netvrdíme, že sme škola
        body:
          - Kým nebude potvrdený náš právny model, netvrdíme, že sme škola, ani že účasť v komunite sama osebe plní povinnú školskú dochádzku. Ako to funguje formálne, vysvetľujeme na stránke Pre rodičov.
        link:
          to: parents
          hash: ako-to-funguje-formalne
          label: Ako to funguje formálne
      - id: bez-akreditacie
        title: Nemáme akreditáciu Montessori ani certifikát Hejného metódy
        body:
          - Inšpirujeme sa princípmi Montessori a Hejného matematikou. Neznamená to, že sme akreditované Montessori zariadenie, ani že máme certifikát na Hejného metódu.
      - id: bez-slubov
        title: Nesľubujeme výsledky
        body:
          - Nesľubujeme výnimočné výsledky, nadpriemerné známky ani to, že náš spôsob vyhovuje každému dieťaťu. Sľubujeme, že budeme dieťa pozorne sledovať a otvorene sa s vami rozprávať o tom, ako sa mu darí.
      - id: nie-proti-skolam
        title: Nie sme proti bežným školám
        body:
          - Mnohé deti sú v bežnej škole spokojné a učia sa v nej dobre. Ponúkame inú cestu pre rodiny, ktorým viac vyhovuje menšia skupina a učenie objavovaním.
  cta:
    status: needs-review
    title: Chcete vidieť, ako to vyzerá naživo?
    text: Najviac sa dozviete pri osobnom stretnutí. Napíšte nám alebo rovno vyplňte krátku prihlášku. Prihláška je prejavom záujmu, nie potvrdením prijatia.
    ctaPrimary: Prihlásiť dieťa
    ctaSecondary: Dohodnúť si stretnutie
