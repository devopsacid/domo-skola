            path: settings.operations.outdoorTime
          - label: Dochádzka
            path: settings.operations.attendance
        link:
          to: contact
          label: Opýtajte sa nás
  cta:
    status: needs-review
    title: Príďte sa pozrieť, ako deň naozaj plynie
    text: Pri návšteve uvidíte prostredie aj pomôcky a môžete sa opýtať na všetko, čo vás zaujíma.
    ctaPrimary: Prihlásiť dieťa
    ctaSecondary: Dohodnúť si stretnutie
