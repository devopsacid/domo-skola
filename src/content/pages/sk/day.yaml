    id: prakticke-informacie
    eyebrow: Prakticky
    title: Čo ešte potvrdzujeme
    intro:
      - Tieto informácie zverejníme, keď budú potvrdené. Ak ich potrebujete poznať skôr, napíšte nám.
    items:
