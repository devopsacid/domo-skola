key: constructivist
order: 3
status: needs-review
title: Konštruktivistické učenie
anchor: konstruktivizmus
summary: Deti si porozumenie budujú samy, skúsenosťou, pokusom a otázkami, a nielen tým, že si ho zapamätajú.
parentBenefits:
  - Učivo stavia na tom, čo dieťa už vie a čo ho zaujíma.
  - Projekty spájajú matematiku, jazyk, prírodu aj umenie.
  - Dieťa sa učí klásť otázky a hľadať odpovede.
whatItMeans: Konštruktivizmus vychádza z toho, že poznanie sa nedá jednoducho „preniesť“ do hlavy. Dieťa ho skladá samo, keď skúma, porovnáva a overuje si svoje predstavy.
inPractice: Učenie často začína otázkou alebo problémom. Deti vyslovia odhad, vyskúšajú ho, porovnajú výsledky a spoločne hľadajú vysvetlenie. Sprievodca kladie otázky a pomáha zhrnúť, na čo prišli.
examples:
  - Pri projekte o vode deti merajú, koľko vody sa vyparí z rôznych nádob, a výsledky zapisujú do tabuľky.
  - Text o zvieratách z okolia napíšu po tom, čo ich samy pozorovali vonku.
benefits: Hlbšie porozumenie, kritické myslenie a radosť z objavovania.
parentsCanExpect: Ukážky projektov a prác, na ktorých uvidíte, čo dieťa skúmalo a ako o tom premýšľa.
