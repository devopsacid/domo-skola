# Pillar (docs/ia.md §4). Working copy, needs-review. Inspired by Montessori principles; no accreditation claimed.
key: montessori
order: 1
status: needs-review
reviewNote: "Working copy; the examples describe possible practice (materials and mixed-age work not confirmed). Owner to confirm."
title: Princípy Montessori
anchor: principy-montessori
summary: Pripravené prostredie, v ktorom si dieťa vyberá prácu, pracuje vlastným tempom a dokončí, čo začalo.
parentBenefits:
  - Dieťa sa učí plánovať si prácu a postarať sa o ňu.
  - Pomôcky sa dajú chytiť do rúk, takže abstraktné veci majú konkrétny tvar.
  - Na náročnejšej úlohe môže zostať tak dlho, ako potrebuje.
whatItMeans: Inšpirujeme sa pedagogikou Márie Montessori. Prostredie je pripravené tak, aby si dieťa vedelo samo vybrať zmysluplnú prácu, pracovať sústredene a samo si overiť výsledok.
inPractice: Pomôcky majú svoje miesto na poličkách. Dieťa si vyberie prácu, pripraví si ju, pracuje a nakoniec ju vráti na miesto. Sprievodca pozoruje, ponúka nové výzvy a pomáha, keď je to potrebné.
examples:
  - Napríklad pri počítaní s pomôckami, ako sú korálky, môže dieťa vidieť, aký veľký je naozaj rozdiel medzi desiatkou a stovkou.
  - Ak sa v skupine stretnú mladšie a staršie deti, môžu pracovať vedľa seba a učiť sa jedno od druhého.
benefits: Samostatnosť, sústredenie a dôvera vo vlastné schopnosti.
parentsCanExpect: Pravidelné informácie o tom, na čom dieťa pracuje, a možnosť vidieť pomôcky a prostredie na vlastné oči.
disclaimer: Náš prístup je inšpirovaný princípmi Montessori. Neznamená to akreditáciu ani certifikáciu Montessori.
