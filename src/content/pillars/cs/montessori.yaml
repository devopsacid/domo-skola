title: Principy Montessori
anchor: principy-montessori
summary: Připravené prostředí, ve kterém si dítě vybírá práci, pracuje vlastním tempem a dokončí, co začalo.
parentBenefits:
  - Dítě se učí plánovat si práci a postarat se o ni.
  - Pomůcky se dají vzít do rukou, takže abstraktní věci dostanou konkrétní podobu.
  - U náročnějšího úkolu může zůstat tak dlouho, jak potřebuje.
whatItMeans: Inspirujeme se pedagogikou Marie Montessori. Prostředí je připravené tak, aby si dítě umělo samo vybrat smysluplnou práci, soustředěně pracovat a samo si ověřit výsledek.
inPractice: Pomůcky mají na policích své místo. Dítě si vybere práci, připraví si ji, pracuje a nakonec ji vrátí na místo. Průvodce pozoruje, nabízí nové výzvy a pomáhá, když je to potřeba.
examples:
  - Při počítání s korálky dítě vidí, jak velký je doopravdy rozdíl mezi desítkou a stovkou.
  - Mladší a starší děti mohou pracovat vedle sebe a učit se jedno od druhého.
benefits: Samostatnost, soustředění a důvěra ve vlastní schopnosti.
parentsCanExpect: Pravidelné informace o tom, na čem dítě pracuje, a možnost vidět pomůcky a prostředí na vlastní oči.
disclaimer: Náš přístup je inspirovaný principy Montessori. Neuvádíme tím akreditaci ani certifikaci Montessori.
