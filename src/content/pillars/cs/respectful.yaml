title: Respektující přístup
anchor: respektujici-pristup
summary: Klidná a otevřená komunikace, ve které děti i dospělí berou jeden druhého vážně.
parentBenefits:
  - Dítě se cítí v bezpečí, a proto se nebojí zkoušet a dělat chyby.
  - Konflikty řešíme rozhovorem a hledáním dohody, ne trestem.
  - S vámi jako rodiči spolupracujeme jako partneři.
whatItMeans: Respektující přístup znamená, že potřeby dítěte i dospělého jsou stejně důležité. Hranice jsou jasné, ale nastavujeme je bez ponižování, křiku a manipulace.
inPractice: Den může začínat společným kruhem, kde je prostor říct, jak se kdo má. Když se děti pohádají, pomůžeme jim pojmenovat, co se stalo, a najít řešení, se kterým mohou žít obě strany.
examples:
  - Místo „Přestaň!“ popíšeme, co vidíme, a zeptáme se, co dítě potřebuje.
  - Pravidla třídy děti spoluvytvářejí a vracejí se k nim, když něco nefunguje.
benefits: Emoční bezpečí, dobré vztahy a schopnost řešit spory.
parentsCanExpect: Otevřenou komunikaci a pravidelné rozhovory o tom, jak se dítěti daří.
