title: Respectful education
anchor: respectful-education
summary: Calm, open communication in which children and adults take each other seriously.
parentBenefits:
  - Your child feels safe, so they dare to try things and make mistakes.
  - Conflicts are solved by talking and finding agreement, not by punishment.
  - We work with you as parents, as partners.
whatItMeans: Respectful education means that a child's needs and an adult's needs matter equally. Boundaries are clear, but we set them without shaming, shouting or manipulation.
inPractice: The day starts with a morning circle where everyone can say how they are. When children fall out, we help them name what happened and find a solution both sides can live with.
examples:
  - Instead of “Stop it!”, we describe what we see and ask what the child needs.
  - Children help write the class rules and come back to them when something isn't working.
benefits: Emotional safety, good relationships and the ability to resolve disagreements.
parentsCanExpect: Open communication and regular conversations about how your child is getting on.
