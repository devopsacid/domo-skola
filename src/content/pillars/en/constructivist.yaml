title: Constructivist learning
anchor: constructivism
summary: Children build their own understanding through experience, experiments and questions, not just by memorising.
parentBenefits:
  - Learning builds on what your child already knows and what interests them.
  - Projects connect maths, language, nature and art.
  - Your child learns to ask questions and look for answers.
whatItMeans: Constructivism starts from the idea that knowledge can't simply be “transferred” into someone's head. Children put it together themselves as they explore, compare and test their ideas.
inPractice: Learning often starts with a question or a problem. Children make a guess, try it out, compare results and look for an explanation together. The guide asks questions and helps sum up what they found.
examples:
  - In a project about water, children measure how much evaporates from different containers and record the results in a table.
  - They write about local animals after observing them outdoors.
benefits: Deeper understanding, critical thinking and the joy of discovery.
parentsCanExpect: Examples of projects and work that show what your child explored and how they think about it.
