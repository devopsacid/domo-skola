question: Aký je rozdiel medzi domoškolou a tradičnou školou?
answer: |-
  Rozdiel je najmä v spôsobe učenia. Pracujeme v malej skupine, deti sa učia objavovaním, s pomôckami a v projektoch a každé postupuje vlastným tempom. Ciele vzdelávania pre 1. stupeň pritom zostávajú dôležité aj pre nás.

  Ako je komunita usporiadaná po právnej stránke a s ktorou školou spolupracuje, zatiaľ potvrdzujeme. Zverejníme to na stránke Pre rodičov.
