question: "Aký je rozdiel medzi domoškolou a tradičnou školou?"
answer: |-
  Rozdiel je najmä v spôsobe učenia. Chceme, aby sa deti učili v menšej skupine, objavovaním, s pomôckami a v projektoch a aby každé postupovalo vlastným tempom. Dospelý má byť sprievodca, ktorý pozoruje a pomáha, nie niekto, kto celý deň vykladá pred tabuľou.

  Ciele vzdelávania pre 1. stupeň zostávajú dôležité aj pre nás. Bežné školy neberieme ako horšie, len ponúkame inú cestu pre rodiny, ktorým viac vyhovuje.
pendingNote: "Ako je komunita usporiadaná po právnej stránke a s ktorou školou spolupracuje, zatiaľ potvrdzujeme. Zverejníme to na stránke Pre rodičov."
