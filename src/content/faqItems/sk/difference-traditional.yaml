question: "Aký je rozdiel medzi domoškolou a tradičnou školou?"
answer: |-
  Rozdiel je najmä v spôsobe učenia. Deti sa učia v menšej skupine, objavovaním, s pomôckami a v projektoch a každé postupuje vlastným tempom. Ciele vzdelávania pre 1. stupeň pritom zostávajú dôležité aj pre nás.
