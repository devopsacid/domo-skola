question: "Ako prebieha prihlásenie?"
answer: |-
  Vyplníte krátku prihlášku alebo nám napíšete. Ozveme sa vám, dohodneme si úvodný rozhovor a pozveme vás aj s dieťaťom spoznať prostredie. Potom sa spoločne rozhodneme o ďalších krokoch.

  Prihláška je prejavom záujmu, nie potvrdením prijatia. Nič sa ňou nezaväzujete.
pendingNote: "Postup a termíny prijímania zatiaľ potvrdzujeme."
