question: Môžu sa prihlásiť rodiny zo všetkých troch regiónov?
answer: |-
  Áno. Radi privítame rodiny z okolia Banskej Bystrice, Ružomberka aj Liptovského Mikuláša. Sme jedna komunita, nie pobočky v každom meste.

  Presné miesto stretávania a možnosti dochádzania zatiaľ potvrdzujeme.
