question: "Môžu sa prihlásiť rodiny zo všetkých troch regiónov?"
answer: |-
  Áno. Radi privítame rodiny z okolia Banskej Bystrice, Ružomberka aj Liptovského Mikuláša. Predpokladáme jedno miesto stretávania, nie pobočky v každom meste, preto sa oplatí myslieť na dochádzanie vopred.
pendingNote: "Presné miesto stretávania a možnosti dochádzania zatiaľ potvrdzujeme."
