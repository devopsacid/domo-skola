question: "Aké veľké sú skupiny?"
answer: |-
  Chceme pracovať v malých skupinách, v ktorých dospelý pozná každé dieťa a má naň čas. Veľa práce prebieha aj v menších skupinkách alebo vo dvojiciach.

  Presný počet detí zatiaľ neuvádzame. Závisí aj od toho, koľko rodín sa prihlási. Keď bude jasný, zverejníme ho.
