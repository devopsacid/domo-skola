question: "Ste škola? Máte akreditáciu Montessori?"
answer: |-
  Kým nebude potvrdený náš právny model, netvrdíme, že sme škola, ani že účasť v komunite sama osebe plní povinnú školskú dochádzku.

  Inšpirujeme sa princípmi Montessori a Hejného matematikou. Nie sme akreditované Montessori zariadenie a nemáme certifikát na Hejného metódu.
