question: "Čo ak dieťa potrebuje viac podpory pri učení?"
answer: |-
  Každé dieťa postupuje vlastným tempom a v malej skupine si ľahšie všimneme, čo potrebuje. Ak má vaše dieťa špecifické potreby, porozprávajme sa o nich ešte pred prihlásením.

  Spoločne a úprimne zvážime, či mu vieme ponúknuť dobré podmienky. Odbornú podporu, napríklad špeciálneho pedagóga, vám zatiaľ nevieme sľúbiť.
