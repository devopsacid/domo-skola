question: "Ako sa plní povinná školská dochádzka?"
answer: |-
  Na Slovensku sa povinná školská dochádzka plní v škole zaradenej do siete škôl. Aj dieťa, ktoré sa učí mimo triedy, má svoju školu, v ktorej je zapísané a ktorá ho hodnotí.

  Ako to bude v prípade našej komunity, závisí od jej právneho modelu a od školy, s ktorou budeme spolupracovať. Radi sa s vami o tom porozprávame osobne.
