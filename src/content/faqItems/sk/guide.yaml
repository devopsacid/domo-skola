question: "Kto je sprievodca a čo robí počas dňa?"
answer: |-
  Sprievodca je dospelý, ktorý je s deťmi počas dňa. Väčšinu času nestojí pred skupinou. Pozoruje deti pri práci, ponúka im novú prácu, kladie otázky a pomáha, keď niekto uviazne. Novú tému predstaví krátko, jednému dieťaťu alebo malej skupinke.

  Kto konkrétne bude s deťmi a aké má vzdelanie a skúsenosti, predstavíme na webe, keď to bude potvrdené. Na osobnom stretnutí sa na to môžete opýtať priamo.
