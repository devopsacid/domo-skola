question: "V akom jazyku prebieha vzdelávanie?"
answer: |-
  Stránky sú v slovenčine, češtine a angličtine, aby si o nás mohlo prečítať čo najviac rodín. Preklad stránok neznamená, že v týchto jazykoch aj prebieha vzdelávanie.
