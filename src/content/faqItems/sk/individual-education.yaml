question: "Čo je individuálne vzdelávanie?"
answer: |-
  Pri individuálnom vzdelávaní sa dieťa neučí v triede svojej školy, ale inde. O povolenie žiada rodič riaditeľa školy, v ktorej je dieťa zapísané. Zákon pri tom kladie podmienky, napríklad na to, kto vzdelávanie zabezpečuje.

  Škola potom pravidelne overuje, čo sa dieťa naučilo, zvyčajne formou preskúšania, a vydáva vysvedčenie. Ide o všeobecný popis, nie o právne poradenstvo.
pendingNote: "Či a ako bude naša komunita s individuálnym vzdelávaním pracovať, zatiaľ potvrdzujeme."
