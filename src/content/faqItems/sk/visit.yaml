reviewNote: "Visits are arranged individually (intended practice); no dates or open days are promised."
question: "Môžeme sa prísť pozrieť?"
answer: |-
  Áno, a odporúčame to. Termín návštevy alebo úvodného stretnutia si dohodneme individuálne. Uvidíte prostredie a pomôcky a môžete sa opýtať na všetko, čo vás zaujíma.

  Napíšte nám cez kontaktný formulár a ako tému zvoľte návštevu.
