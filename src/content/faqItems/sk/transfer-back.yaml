question: "Môže dieťa prestúpiť späť do bežnej školy?"
answer: |-
  S možnosťou prestupu do inej školy počítame. Pomôžeme vám pripraviť sa naň, napríklad prehľadom toho, na čom dieťa pracovalo, čo mu ide a na čom ešte treba pracovať.

  Keďže sledujeme ciele prvého stupňa, chceme, aby prechod bol pre dieťa čo najplynulejší.
pendingNote: "Ako by prestup prebiehal v našom prípade, závisí od školy, v ktorej bude dieťa zapísané. Túto časť zatiaľ potvrdzujeme."
