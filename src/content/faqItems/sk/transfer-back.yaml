question: "Môže dieťa prestúpiť späť do bežnej školy?"
answer: |-
  Ak by ste sa rozhodli pre prestup do inej školy, chceme vám pomôcť pripraviť sa naň, napríklad prehľadom toho, na čom dieťa pracovalo, čo mu ide a na čom ešte treba pracovať.

  Keďže chceme pracovať na cieľoch prvého stupňa, záleží nám na tom, aby bol prechod pre dieťa čo najplynulejší.
pendingNote: "Ako by prestup prebiehal v našom prípade, závisí od školy, v ktorej bude dieťa zapísané. Túto časť zatiaľ potvrdzujeme."
