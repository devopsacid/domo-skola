reviewNote: "Describes the intended respectful approach as possible practice; owner to confirm."
question: "Ako riešite konflikty medzi deťmi?"
answer: |-
  Konflikt berieme ako príležitosť naučiť sa niečo o sebe aj o druhých. Sprievodca pomôže deťom pomenovať, čo sa stalo a ako sa cítia, a hľadať riešenie, s ktorým môžu súhlasiť obe strany.

  Nikoho nezahanbujeme pred ostatnými a netrestáme. Jasne však povieme, čo je v poriadku a čo nie. O vážnejších situáciách sa rozprávame aj s rodičmi.
