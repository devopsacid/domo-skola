question: Ako funguje Hejného matematika?
answer: |-
  Deti nedostanú hotový postup, ale úlohu v prostredí, ktoré poznajú, napríklad Krokovanie alebo Schody. Riešia ju samy alebo v skupine, hľadajú pravidlá a vysvetľujú si, prečo výsledok platí.

  Učiteľ výsledok neprezradí. Kladie otázky, ktoré deťom pomôžu pokročiť. Chyba je súčasť učenia a spoločne sa k nej vraciame.
