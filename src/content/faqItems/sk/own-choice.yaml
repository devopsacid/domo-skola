question: "Čo ak si dieťa nič nevyberie alebo sa vyhýba ťažším veciam?"
answer: |-
  Sloboda u nás neznamená, že si dieťa robí, čo chce. Vyberá si v pripravenom prostredí a v rámci dohodnutých cieľov. Sprievodca si všíma, čomu sa dieťa venuje a čomu sa vyhýba.

  Ak sa dieťa niečomu dlhšie vyhýba, ponúkne mu to iným spôsobom, napríklad cez hru, projekt alebo spoločnú prácu s kamarátom. Keď to nepomáha, rozprávame sa o tom aj s vami.
