question: "Ako sledujete pokrok dieťaťa?"
answer: |-
  Pokrok sledujeme priebežne: pozorujeme dieťa pri práci, zbierame jeho práce a rozprávame sa s ním o tom, čo sa mu darí. Počas dňa chceme deťom namiesto známok dávať slovnú spätnú väzbu.

  S vami sa o pokroku chceme rozprávať pravidelne a konkrétne, nad prácami dieťaťa. Formálne hodnotenie, napríklad vysvedčenie, závisí od školy, v ktorej bude dieťa zapísané.
pendingNote: "Ako bude prebiehať formálne hodnotenie, zatiaľ potvrdzujeme."
