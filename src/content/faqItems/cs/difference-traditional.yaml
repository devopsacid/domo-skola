question: "Jaký je rozdíl mezi domoškolou a běžnou školou?"
answer: |-
  Rozdíl je hlavně ve způsobu učení. Chceme, aby se děti učily v menší skupině, objevováním, s pomůckami a v projektech a aby každé postupovalo vlastním tempem. Dospělý má být průvodce, který pozoruje a pomáhá, ne někdo, kdo celý den vykládá před tabulí.

  Cíle vzdělávání pro 1. stupeň jsou důležité i pro nás. Běžné školy nepovažujeme za horší, jen nabízíme jinou cestu rodinám, kterým víc vyhovuje.
pendingNote: "Jak je komunita uspořádána po právní stránce a se kterou školou spolupracuje, zatím ověřujeme. Zveřejníme to na stránce Pro rodiče."
