question: "Jaký je rozdíl mezi domoškolou a tradiční školou?"
answer: |-
  Rozdíl je hlavně ve způsobu učení. Pracujeme v malé skupině, děti se učí objevováním, s pomůckami a v projektech a každé postupuje vlastním tempem. Cíle vzdělávání pro 1. stupeň jsou přitom důležité i pro nás.

  Jak je komunita uspořádaná po právní stránce a se kterou školou spolupracuje, zatím ověřujeme. Zveřejníme to na stránce Pro rodiče.
