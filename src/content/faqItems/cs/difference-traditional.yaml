question: "Jaký je rozdíl mezi domoškolou a tradiční školou?"
answer: |-
  Rozdíl je hlavně ve způsobu učení. Děti se učí v menší skupině, objevováním, s pomůckami a v projektech a každé postupuje vlastním tempem. Cíle vzdělávání pro 1. stupeň jsou přitom důležité i pro nás.
