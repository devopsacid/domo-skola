reviewNote: "Visits are arranged individually (intended practice); no dates or open days are promised."
question: "Můžeme se přijít podívat?"
answer: |-
  Ano, a doporučujeme to. Termín návštěvy nebo úvodní schůzky si domluvíme individuálně. Uvidíte prostředí a pomůcky a můžete se zeptat na všechno, co vás zajímá.

  Napište nám přes kontaktní formulář a jako téma zvolte návštěvu.
