question: "Jak velké jsou skupiny?"
answer: |-
  Chceme pracovat v malých skupinách, ve kterých dospělý zná každé dítě a má na něj čas. Hodně práce probíhá i v menších skupinkách nebo ve dvojicích.

  Přesný počet dětí zatím neuvádíme. Záleží i na tom, kolik rodin se přihlásí. Jakmile bude jasný, zveřejníme ho.
