question: "Co když dítě potřebuje víc podpory při učení?"
answer: |-
  Každé dítě postupuje vlastním tempem a v malé skupině si snáz všimneme, co potřebuje. Pokud má vaše dítě specifické potřeby, promluvme si o nich ještě před přihlášením.

  Společně a upřímně zvážíme, zda mu dokážeme nabídnout dobré podmínky. Odbornou podporu, například speciálního pedagoga, vám zatím nemůžeme slíbit.
