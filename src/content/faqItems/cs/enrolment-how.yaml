question: "Jak probíhá přihlášení?"
answer: |-
  Vyplníte krátkou přihlášku nebo nám napíšete. Ozveme se vám, domluvíme si úvodní rozhovor a pozveme vás i s dítětem poznat prostředí. Potom se společně rozhodneme o dalších krocích.

  Přihláška je projevem zájmu, ne potvrzením přijetí. Ničím se jí nezavazujete.
pendingNote: "Postup a termíny přijímání zatím ověřujeme."
