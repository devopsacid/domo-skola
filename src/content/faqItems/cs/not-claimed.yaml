question: "Jste škola? Máte akreditaci Montessori?"
answer: |-
  Dokud nebude potvrzen náš právní model, netvrdíme, že jsme škola, ani že účast v komunitě sama o sobě plní povinnou školní docházku.

  Inspirujeme se principy Montessori a Hejného metodou. Nejsme akreditované Montessori zařízení a nemáme certifikát na Hejného metodu.
