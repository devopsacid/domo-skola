question: "Jak sledujete pokrok dítěte?"
answer: |-
  Pokrok sledujeme průběžně: pozorujeme dítě při práci, sbíráme jeho práce a pravidelně o nich s vámi mluvíme.

  Jak bude probíhat formální hodnocení a přezkoušení, záleží na škole, ve které bude dítě zapsané. Tuto část zatím ověřujeme.
