question: "Jak sledujete pokrok dítěte?"
answer: |-
  Pokrok sledujeme průběžně: pozorujeme dítě při práci, sbíráme jeho práce a mluvíme s ním o tom, co se mu daří. Během dne chceme dětem místo známek dávat slovní zpětnou vazbu.

  S vámi chceme o pokroku mluvit pravidelně a konkrétně, nad pracemi dítěte. Formální hodnocení, například vysvědčení, záleží na škole, ve které bude dítě zapsané.
pendingNote: "Jak bude probíhat formální hodnocení, zatím ověřujeme."
