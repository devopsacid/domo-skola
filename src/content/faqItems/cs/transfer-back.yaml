question: "Může dítě přestoupit zpět do běžné školy?"
answer: |-
  Pokud byste se rozhodli pro přestup do jiné školy, chceme vám pomoct se na něj připravit, například přehledem toho, na čem dítě pracovalo, co mu jde a na čem je ještě potřeba pracovat.

  Protože chceme pracovat na cílech prvního stupně, záleží nám na tom, aby byl přechod pro dítě co nejplynulejší.
pendingNote: "Jak by přestup probíhal v našem případě, záleží na škole, ve které bude dítě zapsané. Tuto část zatím ověřujeme."
