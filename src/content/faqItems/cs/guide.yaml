question: "Kdo je průvodce a co dělá během dne?"
answer: |-
  Průvodce je dospělý, který je s dětmi během dne. Většinu času nestojí před skupinou. Pozoruje děti při práci, nabízí jim novou práci, klade otázky a pomáhá, když se někdo zasekne. Nové téma představí krátce, jednomu dítěti nebo malé skupince.

  Kdo konkrétně bude s dětmi a jaké má vzdělání a zkušenosti, představíme na webu, jakmile to bude potvrzené. Na osobní schůzce se na to můžete zeptat přímo.
