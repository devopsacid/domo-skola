question: "Jak řešíte konflikty mezi dětmi?"
answer: |-
  Konflikt bereme jako příležitost naučit se něco o sobě i o druhých. Průvodce má dětem pomoct pojmenovat, co se stalo a jak se cítí, a hledat řešení, se kterým můžou souhlasit obě strany.

  Nechceme nikoho ztrapňovat před ostatními ani trestat. Jasně ale chceme říct, co je v pořádku a co ne. O vážnějších situacích chceme mluvit i s rodiči.
