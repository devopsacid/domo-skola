question: "Jak řešíte konflikty mezi dětmi?"
answer: |-
  Konflikt bereme jako příležitost naučit se něco o sobě i o druhých. Průvodce pomůže dětem pojmenovat, co se stalo a jak se cítí, a hledat řešení, se kterým můžou souhlasit obě strany.

  Nikoho neztrapňujeme před ostatními a netrestáme. Jasně ale řekneme, co je v pořádku a co ne. O vážnějších situacích mluvíme i s rodiči.
