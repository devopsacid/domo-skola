question: "Co když si dítě nic nevybere nebo se vyhýbá těžším věcem?"
answer: |-
  Svoboda u nás neznamená, že si dítě dělá, co chce. Vybírá si v připraveném prostředí a v rámci domluvených cílů. Průvodce si všímá, čemu se dítě věnuje a čemu se vyhýbá.

  Pokud se dítě něčemu delší dobu vyhýbá, nabídne mu to jinak, třeba přes hru, projekt nebo společnou práci s kamarádem. Když to nepomáhá, mluvíme o tom i s vámi.
