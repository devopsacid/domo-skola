question: "Kolik času tráví děti venku?"
answer: |-
  Čas venku je pro nás součástí učení, ne jen přestávkou. Venku se dá měřit, pozorovat a zkoumat a děti se přitom i proběhnou. Chceme chodit ven každý den, i když nesvítí slunce, pokud je to bezpečné.

  Pomůže, když má dítě oblečení, které se může ušpinit, a náhradní věci.
pendingNote: "Kolik času venku to bude v běžném dni, zatím ověřujeme."
