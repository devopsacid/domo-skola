question: "Jak funguje Hejného metoda?"
answer: |-
  Děti nedostanou hotový postup, ale úlohu v prostředí, které znají, například Krokování nebo Schody. Řeší ji samy nebo ve skupině, hledají pravidla a vysvětlují si, proč výsledek platí.

  Učitel výsledek neprozradí. Klade otázky, které dětem pomohou pokročit. Chyba je součást učení a společně se k ní vracíme.
