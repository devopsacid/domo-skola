question: "Jak se plní povinná školní docházka?"
answer: |-
  Na Slovensku se povinná školní docházka plní ve škole zařazené do sítě škol. I dítě, které se učí mimo třídu, má svou školu, ve které je zapsané a která ho hodnotí. Pravidla v Česku se v některých bodech liší.

  Jak to bude v případě naší komunity, záleží na jejím právním modelu a na škole, se kterou budeme spolupracovat. Rádi si o tom s vámi promluvíme osobně.
