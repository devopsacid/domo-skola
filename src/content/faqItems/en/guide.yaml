question: "Who is the guide, and what do they do during the day?"
answer: |-
  The guide is the adult who is with the children during the day. Most of the time they do not stand in front of the group. They watch the children work, offer new work, ask questions and help when someone gets stuck. A new topic is introduced briefly, to one child or a small group.

  We will introduce who exactly will be with the children, and their education and experience, once this is confirmed. You are welcome to ask about it directly when we meet.
