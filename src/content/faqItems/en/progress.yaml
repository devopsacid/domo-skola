question: "How do you follow a child's progress?"
answer: |-
  We follow progress continuously: we watch the child at work, collect their work and talk with them about what is going well. During the day we want to give spoken feedback instead of grades.

  We want to talk with you about progress regularly and concretely, over your child's actual work. Formal assessment, such as the school report, depends on the school where the child is enrolled.
pendingNote: "We are still confirming how formal assessment will work."
