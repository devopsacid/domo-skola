question: "What if my child needs more support with learning?"
answer: |-
  Every child moves at their own pace, and in a small group it is easier to notice what a child needs. If your child has specific needs, let us talk about them before you apply.

  Together we will honestly consider whether we can offer good conditions. We cannot promise specialist support, such as a special educational needs specialist, at this stage.
