question: "What if my child does not choose anything, or avoids harder work?"
answer: |-
  Freedom here does not mean children do whatever they like. They choose within a prepared environment and within agreed goals. The guide notices what a child takes up and what they avoid.

  If a child keeps avoiding something, the guide offers it another way, for example through a game, a project or working with a friend. If that does not help, we talk about it with you too.
