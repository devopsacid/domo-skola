question: "Can my child move back to a conventional school?"
answer: |-
  If you decide to move your child to another school, we want to help you prepare, for example with an overview of what your child has worked on, what goes well and what still needs work.

  Because we want to work towards the goals of the first four grades, we care about making the move as smooth as possible for the child.
pendingNote: "How a transfer would work in our case depends on the school where the child is enrolled. We are still confirming this."
