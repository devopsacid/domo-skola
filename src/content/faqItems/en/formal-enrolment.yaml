question: "Which school is my child formally enrolled in?"
answer: |-
  That depends on the community's legal model and on the agreement with a school. Parents enrol their child in a school, following the school's rules and dates. We will help you find your way through what needs doing and when.

  The difference between a registered school, a community learning group and individual education is explained on the For parents page.
