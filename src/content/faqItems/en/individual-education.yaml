question: "What is individual education?"
answer: |-
  In individual education (the Slovak term for a form of home education), the child does not learn in a classroom at their school but elsewhere. The parent asks the head of the school where the child is enrolled for permission. The law sets conditions, for example on who provides the education.

  The school then regularly checks what the child has learned, usually through an examination, and issues the school report. This is a general description, not legal advice.
