question: "How is a home-education community different from a traditional school?"
answer: |-
  Mainly in the way children learn. We want children to learn in a smaller group, through discovery, with hands-on materials and projects, each moving at their own pace. The adult is meant to be a guide who observes and helps, not someone who lectures at the front all day.

  The learning goals for the first four grades still matter to us. We do not see ordinary schools as worse; we offer a different path for families it suits better.
