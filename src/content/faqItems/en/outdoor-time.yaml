question: "How much time do children spend outdoors?"
answer: |-
  Time outdoors is part of learning for us, not just a break. Outside you can measure, observe and explore, and the children get to run around too. We want to go out every day, even when the sun is not shining, as long as it is safe.

  It helps if your child has clothes that can get dirty, and a change of clothes.
