question: "How is compulsory education fulfilled?"
answer: |-
  Under Slovak rules, compulsory school attendance is usually fulfilled at a school that is part of the official school network. Even a child who learns outside a classroom has a school where they are enrolled and which assesses them.

  How this will work for our community depends on its legal model and, if that route is used, on the school we would work with. We are happy to talk it through with you in person.
