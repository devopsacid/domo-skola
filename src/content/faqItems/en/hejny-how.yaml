question: "How does Hejný mathematics work?"
answer: |-
  Children are not handed a ready-made procedure. They get a problem in a setting they already know, such as Stepping or Stairs, solve it alone or in a group, look for patterns and explain to each other why the answer works.

  The guide does not give the answer away. They ask questions that help the children move on. Mistakes are part of learning and we come back to them together. We are inspired by the Hejný method; we hold no certification for it.
