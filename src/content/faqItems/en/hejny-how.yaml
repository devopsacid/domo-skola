question: "How does Hejný mathematics work?"
answer: |-
  Children don't get a ready-made procedure. They get a problem in an environment they know, such as Stepping or Stairs. They solve it alone or in a group, look for rules and explain to each other why the answer works.

  The guide doesn't give the answer away but asks questions that help children move on. Mistakes are part of learning, and we come back to them together.
