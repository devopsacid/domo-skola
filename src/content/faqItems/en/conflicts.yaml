reviewNote: "Describes the intended respectful approach as possible practice; owner to confirm."
question: "How are conflicts between children handled?"
answer: |-
  We see a conflict as a chance to learn something about yourself and others. The guide is there to help the children name what happened and how they feel, and look for a solution both sides can agree to.

  We do not want to shame anyone in front of others or to punish. We do want to say clearly what is and is not OK, and to talk about more serious situations with parents too.
