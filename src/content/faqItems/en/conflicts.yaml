question: "How are conflicts between children handled?"
answer: |-
  We see a conflict as a chance to learn something about yourself and others. The guide helps the children name what happened and how they feel, and look for a solution both sides can agree to.

  We do not shame anyone in front of others and we do not punish. We do say clearly what is and is not OK. More serious situations are also discussed with parents.
