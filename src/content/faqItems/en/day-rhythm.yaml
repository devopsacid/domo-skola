question: "What does an ordinary day look like?"
answer: |-
  The day should have a calm, recurring rhythm. It might start with a morning circle, followed by independent work with materials, maths and language, time outdoors, projects and creative work. At the end the children look back together at what went well.

  The order can change with the weather and the project. You will find an illustrative example on the Our day page.
pendingNote: "We are still confirming when the day starts and ends."
