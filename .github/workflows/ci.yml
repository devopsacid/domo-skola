name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  PNPM: pnpm@10.34.6

# TODO(devops): pin the actions below to full commit SHAs (checkout, setup-node, upload-artifact,
# download-artifact). The SHAs could not be verified offline, so the major-version tags stay for now.
jobs:
  verify:
    name: lint, typecheck, test, build, check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (astro build, then CSP headers)
        run: pnpm build
        env:
          SITE_URL: https://ci.invalid
          PUBLIC_NOINDEX: 'true'
      - run: pnpm check
        env:
          SITE_URL: https://ci.invalid
          PUBLIC_NOINDEX: 'true'
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 3

  # Browser tests against the built site (wrangler pages dev, local D1, mock mail, dev Access proxy).
  # Builds its own dist/ (the e2e stacks need dist/_headers and Functions next to it).
  e2e:
    name: e2e (forms, then admin)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build (astro build, then CSP headers)
        run: pnpm build
        env:
          SITE_URL: https://ci.invalid
          PUBLIC_NOINDEX: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (forms projects, then the admin project; see package.json test:e2e)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # Present but skipped until lighthouserc.json exists (L3 onwards).
  lighthouse:
    name: lighthouse (skipped until lighthouserc.json exists)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Detect Lighthouse CI config
        id: detect
        run: |
          if [ -f lighthouserc.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No lighthouserc.json yet, Lighthouse CI skipped."; fi
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
      - if: steps.detect.outputs.present == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        if: steps.detect.outputs.present == 'true'
        with:
          name: dist
          path: dist
      - if: steps.detect.outputs.present == 'true'
        run: pnpm exec lhci autorun
